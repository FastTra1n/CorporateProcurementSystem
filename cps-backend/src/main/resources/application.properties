spring.application.name=CorporateProcurementSystem
# Data source details for Spring Data JPA.
spring.datasource.url=jdbc:postgresql://localhost:5432/corporate_procurement_system
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# Hibernate configuration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.mapping-resources=META-INF/orm.xml
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true
# Flyway migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:database/migrations
# Optional first-administrator provisioning.
cps.security.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
cps.security.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Base64-encoded signing secret containing at least 32 random bytes.
cps.security.jwt.secret=${JWT_SECRET:}
cps.security.jwt.issuer=https://corporate-procurement.local
cps.security.jwt.audience=cps-api
cps.security.jwt.access-ttl=PT15M
cps.security.jwt.refresh-ttl=P30D

cps.security.rate-limit.account-attempts=5
cps.security.rate-limit.account-window=PT15M
cps.security.rate-limit.ip-attempts=30
cps.security.rate-limit.ip-window=PT1M
cps.security.rate-limit.refresh-attempts=60
cps.security.rate-limit.max-tracked-keys=10000

# API documentation.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**

# Only aggregate health is exposed; the database contributes to its status.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
