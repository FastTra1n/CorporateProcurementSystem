spring.application.name=CorporateProcurementSystem

# Data source details for Spring Data JPA.
spring.datasource.url=jdbc:postgresql://localhost:5432/corporate_procurement_system
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Hibernate configuration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

# Flyway migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:database/migrations
